<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI에이전트마스터 2주차 실습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: 상단 과정 헤더 + 진행률, 모듈 탭(한 번에 한 모듈), 모듈 안은 개념 카드 → 단계 체크리스트 → 복사 블록 */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --sunk:#E9EDF3; --line:#D5DCE6;
  --ink:#16202C; --muted:#5A6676; --accent:#2D55D6; --accent-soft:#E3EAFC;
  --copy:#B26B00; --copy-soft:#FFF3DD; --good:#1E7F4F; --good-soft:#E1F3E9; --warn:#A8461A; --warn-soft:#FBE8DE;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10151C; --surface:#18202A; --sunk:#202A36; --line:#2D3947;
  --ink:#E7ECF2; --muted:#9AA6B5; --accent:#7D9BFF; --accent-soft:#1F2C4D;
  --copy:#F2B54A; --copy-soft:#3A2C12; --good:#5FCB93; --good-soft:#163326; --warn:#F09A70; --warn-soft:#3A2218; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151C; --surface:#18202A; --sunk:#202A36; --line:#2D3947;
  --ink:#E7ECF2; --muted:#9AA6B5; --accent:#7D9BFF; --accent-soft:#1F2C4D;
  --copy:#F2B54A; --copy-soft:#3A2C12; --good:#5FCB93; --good-soft:#163326; --warn:#F09A70; --warn-soft:#3A2218; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65;margin:0}
.wrap{max-width:980px;margin:0 auto;padding-inline:20px;padding-block:28px 48px}
h1,h2,h3{text-wrap:balance;line-height:1.3;margin:0}
a{color:var(--accent)}
code,.mono{font-family:var(--f-mono);font-size:.88em}
/* header */
.course{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;color:var(--muted);font-size:.85rem;letter-spacing:.02em}
.course b{color:var(--accent);font-weight:600}
h1{font-size:clamp(1.6rem,3.6vw,2.2rem);font-weight:700;margin-top:6px}
.lead{color:var(--muted);max-width:62ch;margin:8px 0 0}
.progress{margin-top:18px;display:flex;align-items:center;gap:12px}
.bar{flex:1;height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--good);transition:width .3s}
.progress span{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-top:20px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
.tabs ol{list-style:none;display:flex;gap:4px;margin:0;padding:0;min-width:max-content}
.tabs button{font:inherit;font-size:.92rem;border:0;background:none;color:var(--muted);padding:12px 12px 10px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tabs button:focus-visible,.btn:focus-visible,.copybtn:focus-visible,input:focus-visible+label{outline:2px solid var(--accent);outline-offset:2px}
.tabs .n{font-family:var(--f-mono);font-size:.78rem;margin-right:6px;color:var(--accent)}
/* module */
section.mod{padding-top:26px}
.mod-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;align-items:baseline}
.mod-head h2{font-size:1.45rem}
.time{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.goal{margin:10px 0 0;max-width:68ch}
h3{font-size:1.05rem;margin:28px 0 12px;display:flex;gap:8px;align-items:center}
h3::before{content:"";width:6px;height:18px;border-radius:2px;background:var(--accent)}
.concepts{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.concept{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.concept b{display:block;font-weight:600}
.concept small{display:block;color:var(--muted);font-size:.88rem;margin-top:4px;line-height:1.55}
/* flow */
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0}
.flow span{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:.9rem}
.flow span.key{background:var(--accent-soft);border-color:var(--accent);font-weight:600}
.flow em{font-style:normal;color:var(--muted)}
/* steps */
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;grid-template-columns:28px 1fr;gap:4px 12px;min-width:0}
.step.done{border-color:var(--good);background:linear-gradient(var(--good-soft),var(--good-soft)) padding-box}
.step input{width:20px;height:20px;margin:3px 0 0;accent-color:var(--good);cursor:pointer}
.step .body{min-width:0}
.step label{font-weight:600;cursor:pointer}
.step p{margin:4px 0 0;color:var(--muted);font-size:.93rem}
.cp{display:inline-block;font-family:var(--f-mono);font-size:.72rem;background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:1px 8px;margin-left:6px;vertical-align:2px;font-weight:600}
/* copy block */
.copy{margin-top:10px;border:1px dashed var(--copy);background:var(--copy-soft);border-radius:8px;min-width:0}
.copy-top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 8px 0 12px}
.tag{font-size:.72rem;font-weight:700;letter-spacing:.06em;color:var(--copy)}
.copybtn{font:inherit;font-size:.8rem;font-weight:600;border:1px solid var(--copy);background:var(--surface);color:var(--copy);border-radius:6px;padding:3px 10px;cursor:pointer}
.copybtn.ok{background:var(--good);border-color:var(--good);color:var(--surface)}
.copy pre{margin:0;padding:6px 12px 12px;white-space:pre-wrap;word-break:break-word;font-family:var(--f-mono);font-size:.86rem;line-height:1.6;color:var(--ink);overflow-x:auto}
.copy.url pre{word-break:break-all}
/* callouts */
.note{border-radius:10px;padding:12px 16px;margin-top:14px;font-size:.93rem}
.note.tip{background:var(--accent-soft)}
.note.warn{background:var(--warn-soft)}
.note.warn b{color:var(--warn)}
.note.tip b{color:var(--accent)}
.formula{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:16px 18px;margin-top:6px}
.formula .eq{font-family:var(--f-mono);font-size:1rem;font-weight:600;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.formula .eq span{background:var(--accent-soft);border-radius:6px;padding:4px 10px}
.formula .eq em{font-style:normal;color:var(--muted)}
.tree{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;overflow-x:auto}
.tree pre{margin:0;font-family:var(--f-mono);font-size:.85rem;line-height:1.7}
.tree .c{color:var(--muted)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.78rem;letter-spacing:.04em;color:var(--muted);font-weight:600;background:var(--sunk)}
tr:last-child td{border-bottom:0}
td .copybtn{white-space:nowrap}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:32px;flex-wrap:wrap}
.btn{font:inherit;font-size:.92rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 16px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
.btn[disabled]{visibility:hidden}
footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:.8rem;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:14px;font-size:.85rem;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:6px}
/* colab notebooks */
.nbbox{display:grid;gap:14px}
.dlrow{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.dlrow p{margin:0;color:var(--muted);font-size:.9rem;max-width:56ch;min-width:0}
.settings{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.settings h4{margin:0 0 4px;font-size:.95rem}
.settings .hint{margin:0 0 12px;color:var(--muted);font-size:.86rem}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 12px}
.fields label{display:grid;gap:4px;font-size:.8rem;color:var(--muted);font-weight:600;min-width:0}
.fields input{font:inherit;font-size:.95rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 10px;width:100%;min-width:0}
.fields input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.nbcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.nbcard header{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;justify-content:space-between}
.nbcard h4{margin:0;font-size:1rem;font-family:var(--f-mono);font-weight:600}
.nbcard .io{font-size:.82rem;color:var(--muted);font-family:var(--f-mono)}
.nbcard .io b{color:var(--good);font-weight:600}
.nbcard p{margin:6px 0 0;color:var(--muted);font-size:.9rem}
.nbcard .copy pre{max-height:260px;overflow:auto;white-space:pre;word-break:normal}
.badge{font-size:.72rem;font-weight:700;border-radius:99px;padding:1px 8px;background:var(--sunk);color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:.88rem;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:560px){.wrap{padding-inline:16px}.step{grid-template-columns:24px 1fr;padding:12px}}
</style>
</head>

<div class="wrap">
  <header>
    <div class="course"><b>AI 에이전트 마스터 </b><span>2주차 실습 강의안</span><span>강사 김성식</span></div>
    <h1>크롤링한 데이터로 보고서와 PPT까지, 스킬로 끝내기</h1>
    <p class="lead">AI 브라우저로 조사하고, 구글 코랩으로 뉴스 100건을 모으고, 남이 만든 스킬을 작업 폴더에 깔아 Antigravity에서 보고서와 PPT를 만듭니다. 단계를 끝낼 때마다 체크하세요.</p>

const NB_CODE={"1.뉴스주소_크롤러.ipynb": ["import undetected_chromedriver as uc\nfrom selenium.webdriver.common.by import By\nfrom selenium.webdriver.support.ui import WebDriverWait\nfrom selenium.webdriver.support import expected_conditions as EC\nfrom selenium.webdriver.common.keys import Keys\nimport pandas as pd\nimport time\n\ndef scrape_naver_sds_main_only(keyword, target_count=100):\n    print(f\"🚀 SDS headline1 메인 뉴스 추출 시작 (목표: {target_count}개): {keyword})\")\n\n    options = uc.ChromeOptions()\n    options.add_argument('--headless=new') # 디버깅 시에는 주석 처리해서 브라우저가 도는 걸 확인하세요\n    options.add_argument('--no-sandbox')\n    options.add_argument('--disable-dev-shm-usage')\n    options.add_argument(\"user-agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36\")\n    options.binary_location = '/usr/bin/google-chrome-stable' # Colab에서 Google Chrome 바이너리 위치 지정\n\n    # Fix: Specify the main version of Chrome to match the installed browser\n    driver = uc.Chrome(options=options)\n\n    try:\n        url = f\"https://search.naver.com/search.naver?where=news&query={keyword}\"\n        driver.get(url)\n        wait = WebDriverWait(driver, 10)\n\n        results = []\n        last_height = driver.execute_script(\"return document.body.scrollHeight\")\n\n        while len(results) < target_count:\n            # 1. 현재 화면의 요소들 추출\n            main_spans = driver.find_elements(By.CSS_SELECTOR, \"span.sds-comps-text-type-headline1\")\n            print(f\"DEBUG: Found {len(main_spans)} main spans on current page.\")\n\n            for span in main_spans:\n                try:\n                    title = span.text.strip()\n                    if not title: continue\n\n                    parent_a = span.find_element(By.XPATH, \"./ancestor::a\")\n                    link = parent_a.get_attribute(\"href\")\n\n                    # 중복 체크 후 추가\n                    if link and not any(res['Link'] == link for res in results):\n                        results.append({\"Title\": title, \"Link\": link})\n                        if len(results) >= target_count: break\n                except Exception as e:\n                    print(f\"DEBUG: Error extracting title/link from span ('{span.text.strip()}'): {e}\")\n                    continue\n\n            if len(results) >= target_count:\n                break\n\n            # 2. 스크롤 내리기 (네이버는 스크롤 시 새로운 뉴스를 로딩함)\n            try:\n                driver.execute_script(\"window.scrollTo(0, document.body.scrollHeight);\")\n                time.sleep(2) # 로딩 대기\n\n                new_height = driver.execute_script(\"return document.body.scrollHeight\")\n                if new_height == last_height: # 더 이상 내려갈 곳이 없으면(결과 부족 등) 종료\n                    print(f\"DEBUG: No new content loaded after scroll. Current height: {last_height}, New height: {new_height}\")\n                    break\n                last_height = new_height\n                print(f\"⏳ 현재 {len(results)}개 수집 중...\")\n            except Exception as e:\n                print(f\"DEBUG: Error during scrolling: {e}\")\n                break # 스크롤 중 오류 발생 시 루프 종료\n\n        # 결과 저장\n        if results:\n            df = pd.DataFrame(results)\n            df.to_csv(\"url_news.csv\", index=False, encoding=\"utf-8-sig\")\n            print(f\"✅ 성공! 총 {len(df)}개의 뉴스를 저장했습니다.\")\n        else:\n            print(\"🚨 검색 결과를 찾지 못했습니다.\")\n\n    except Exception as e:\n        print(f\"❌ 오류 발생: {e}\")\n    finally:\n        driver.quit()\n\nif __name__ == \"__main__\":\n    # 원하는 개수를 두 번째 인자로 전달 (예: 100)\n    scrape_naver_sds_main_only(\"AI 교육\", 100)"], "2.뉴스본문_스크랩.ipynb": ["import pandas as pd\nimport sys\n\n# Install missing dependency if not already installed\ntry:\n    import lxml_html_clean # check if lxml_html_clean is importable\nexcept ImportError:\n    print(\"Installing lxml[html_clean] to resolve ImportError...\")\n    !pip install lxml[html_clean]\n    # Restarting the kernel after installation to ensure new packages are loaded\n    # This is often necessary for packages that deeply integrate with existing ones\n    # such as lxml. If the import still fails, a manual restart might be needed.\n    print(\"Installation complete. You might need to restart the runtime for changes to take full effect.\")\n\n# Add a similar check for newspaper3k\ntry:\n    from newspaper import Article\nexcept ImportError:\n    print(\"Installing newspaper3k to resolve ModuleNotFoundError: No module named 'newspaper'...\")\n    !pip install newspaper3k\n    # Attempt to import again after installation\n    try:\n        from newspaper import Article # This will succeed if the install worked, or re-raise if it didn't.\n    except ImportError:\n        print(\"WARNING: newspaper3k was installed, but the 'newspaper' module is still not found.\")\n        print(\"A runtime restart ('Runtime' -> 'Restart runtime...') is required for changes to take full effect.\")\n        raise # Re-raise to make sure the user sees the error and acts.\n    print(\"newspaper3k installation complete. You might need to restart the runtime for changes to take full effect.\")\n\nimport time\n\ndef extract_news_content(input_csv_path, output_csv_path):\n    # 1. 이전 단계에서 저장한 CSV 불러오기\n    try:\n        df = pd.read_csv(input_csv_path)\n        print(f\"📂 {len(df)}개의 링크를 분석하기 위해 불러왔습니다.\")\n    except FileNotFoundError:\n        print(f\"❌ {input_csv_path} 파일을 찾을 수 없습니다. 먼저 주소 수집을 완료해 주세요.\")\n        return\n\n    content_results = []\n\n    # 2. 링크를 순회하며 본문 추출\n    for i, row in df.iterrows():\n        url = row['Link']\n        title = row['Title']\n\n        print(f\"[{i+1}/{len(df)}] 본문 수집 중: {title[:20]}...\")\n\n        try:\n            # newspaper3k의 Article 객체 생성 (언어는 한국어 'ko')\n            article = Article(url, language='ko')\n            article.download()\n            article.parse()\n\n            # 본문 데이터 저장 (불필요한 공백 제거)\n            text = article.text.strip()\n\n            content_results.append({\n                \"Title\": title,\n                \"Link\": url,\n                \"Content\": text if text else \"본문을 추출할 수 없습니다.\"\n            })\n\n        except Exception as e:\n            print(f\"⚠️ {title[:10]}... 수집 실패: {e}\")\n            content_results.append({\n                \"Title\": title,\n                \"Link\": url,\n                \"Content\": \"오류로 인해 수집 실패\"\n            })\n\n        # 서버 부하 방지용 짧은 휴식\n        time.sleep(1)\n\n    # 3. 결과 저장\n    final_df = pd.DataFrame(content_results)\n    final_df.to_csv(output_csv_path, index=False, encoding=\"utf-8-sig\")\n    print(f\"\\n✨ 모든 작업 완료! 본문이 포함된 파일이 '{output_csv_path}'로 저장되었습니다.\")\n\nif __name__ == \"__main__\":\n    # 이전 단계 파일명: sds_main_news.csv\n    # 결과 저장 파일명: news_with_content.csv\n    extract_news_content(\"url_news.csv\", \"content_news.csv\")"], "3.블로그주소 크롤러.ipynb": ["# Install necessary packages\n!pip install selenium webdriver-manager\n\n# Install Chrome browser\n!apt-get update\n!apt-get install -y wget\n!wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb\n!dpkg -i google-chrome-stable_current_amd64.deb\n!apt-get install -f # Install dependencies if any\n\nimport re\nfrom selenium import webdriver\nfrom selenium.webdriver.chrome.options import Options\nfrom selenium.webdriver.common.by import By\nfrom selenium.webdriver.chrome.service import Service\nfrom webdriver_manager.chrome import ChromeDriverManager\nimport pandas as pd\nimport time\n\ndef solve_naver_2026():\n    options = Options()\n    # 2026년 보안 우회를 위해 자동화 탐지 방지 설정 추가\n    options.add_experimental_option(\"excludeSwitches\", [\"enable-automation\"])\n    options.add_experimental_option('useAutomationExtension', False)\n\n    # Headless 옵션 추가 및 WebDriverManager 사용\n    options.add_argument(\"--headless\") # 실제 동작을 보고 싶다면 주석 처리\n    options.add_argument(\"--no-sandbox\")\n    options.add_argument(\"--disable-dev-shm-usage\")\n    options.add_argument(\"--window-size=1920,1080\") # Set a common window size for headless\n    options.add_argument(\"--disable-gpu\") # Often needed for headless Chrome\n    options.binary_location = \"/usr/bin/google-chrome\" # Explicitly set Chrome binary location\n\n    service = Service(ChromeDriverManager().install())\n    driver = webdriver.Chrome(service=service, options=options)\n\n    url = \"https://search.naver.com/search.naver?ssc=tab.blog.all&sm=tab_jum&query=ai+%EC%97%90%EC%9D%B4%EC%A0%84%ED%8A%B8\"\n\n    results = []\n    try:\n        driver.get(url)\n        time.sleep(5) # 페이지가 완전히 그려질 때까지 넉넉히 대기\n\n        # Regex patterns for blog post links\n        # blog.naver.com/user_id/post_number (post_number is digits)\n        blog_post_pattern_blog = re.compile(r\"blog\\.naver\\.com/[^/]+/\\d+$\")\n        # post.naver.com/viewer/postView.naver?volumeNo=post_number&...\n        blog_post_pattern_post = re.compile(r\"post\\.naver\\.com/viewer/postView\\.naver\\?volumeNo=\\d+\")\n\n        while len(results) < 100:\n            # 2. 모든 a 태그 중 블로그 링크 패턴을 가진 것을 본문 영역에서만 추출\n            # href에 'blog.naver.com'이나 'post.naver.com'이 포함된 링크를 찾습니다.\n            all_links = driver.find_elements(By.XPATH, \"//a[contains(@href, 'blog.naver.com') or contains(@href, 'post.naver.com')]\")\n\n            for link_elem in all_links:\n                try:\n                    # 광고 영역(보통 상단이나 우측)에 있는 것은 좌표로 제외 가능하지만,\n                    # 여기서는 텍스트가 있는 '제목' 성격의 링크만 수집합니다.\n                    title = link_elem.text.strip()\n                    href = link_elem.get_attribute('href')\n\n                    # Filtering condition: check if the link is a blog post using regex\n                    is_blog_post = False\n                    if blog_post_pattern_blog.search(href) or blog_post_pattern_post.search(href):\n                        is_blog_post = True\n\n                    if is_blog_post and len(title) > 5 and href not in [r['Link'] for r in results]:\n                        results.append({\"Title\": title, \"Link\": href})\n                        if len(results) >= 100: break\n                except:\n                    continue\n\n            if len(results) >= 100: break\n\n            # 3. 스크롤을 내려서 데이터를 더 불러옵니다.\n            driver.execute_script(\"window.scrollTo(0, document.body.scrollHeight);\")\n            print(f\"현재 본문에서 {len(results)}개의 블로그 포스팅 링크 확인됨...\")\n            time.sleep(2)\n\n            # 더 이상 결과가 안 늘어나면 중단\n            if len(all_links) == 0: break\n\n        # 저장\n        df = pd.DataFrame(results)\n        df.to_csv(\"blogurlout.csv\", index=False, encoding=\"utf-8-sig\")\n        print(f\"✅ 최종 완료! {len(df)}개의 블로그 포스팅 주소를 저장했습니다.\")\n\n    finally:\n        driver.quit()\n\nif __name__ == \"__main__\":\n    solve_naver_2026()", "import pandas as pd\n\ntry:\n    df_output = pd.read_csv('out.csv')\n    print(\"out.csv 파일 내용:\")\n    display(df_output.head())\n    print(f\"총 {len(df_output)}개의 블로그 링크가 저장되어 있습니다.\")\nexcept FileNotFoundError:\n    print(\"out.csv 파일을 찾을 수 없습니다. 스크랩핑이 제대로 완료되었는지 확인해주세요.\")\nexcept Exception as e:\n    print(f\"파일을 읽는 도중 오류가 발생했습니다: {e}\")"], "4.블로그본문스크랩1.ipynb": ["import pandas as pd\nimport requests\nfrom bs4 import BeautifulSoup\nimport time\nimport re\n\ndef get_naver_real_url(url):\n    \"\"\"일반 네이버 블로그 주소를 본문이 노출되는 실제 주소로 변환\"\"\"\n    if \"blog.naver.com\" in url:\n        match = re.search(r\"blog.naver.com/([\\w-]+)/(\\d+)\", url)\n        if match:\n            user_id = match.group(1)\n            log_no = match.group(2)\n            return f\"https://blog.naver.com/PostView.naver?blogId={user_id}&logNo={log_no}\"\n    return url\n\ndef scrape_naver_blog(input_file='blogurlout.csv', output_file='blogmain.csv'):\n    try:\n        # ✅ FIX 3: BOM 문자 제거를 위해 encoding='utf-8-sig' 추가\n        df_input = pd.read_csv(input_file, encoding='utf-8-sig')\n\n        # ✅ FIX 1: 'Link' → 'link' (소문자로 통일해서 비교)\n        url_col = [col for col in df_input.columns if 'link' in col.lower()][0]\n\n        # ✅ FIX 2: title 컬럼도 함께 추출\n        title_col = [col for col in df_input.columns if 'title' in col.lower()][0]\n\n        urls = df_input[url_col].dropna().tolist()[:100]\n        titles = df_input[title_col].dropna().tolist()[:100]\n\n    except Exception as e:\n        print(f\"파일 로드 오류: {e}\")\n        return\n\n    results = []\n    headers = {\n        'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36'\n    }\n\n    print(f\"네이버 블로그 본문 수집 시작 (총 {len(urls)}개)...\")\n\n    for i, (original_url, title) in enumerate(zip(urls, titles)):  # ✅ FIX 2: title 함께 순회\n        try:\n            real_url = get_naver_real_url(original_url)\n            print(f\"[{i+1}/{len(urls)}] 수집 중: {original_url}\")\n\n            resp = requests.get(real_url, headers=headers, timeout=10)\n            resp.raise_for_status()\n            soup = BeautifulSoup(resp.text, 'html.parser')\n\n            content_area = soup.select_one('.se-main-container')\n\n            if content_area:\n                content = content_area.get_text(separator='\\n').strip()\n            else:\n                content_area = soup.select_one('#postViewArea')\n                content = content_area.get_text(separator='\\n').strip() if content_area else \"본문을 찾을 수 없음\"\n\n            results.append({\n                \"Title\": title,       # ✅ FIX 2: 이제 title 정상 참조\n                'Link': original_url,\n                'content': content\n            })\n\n            time.sleep(1.5)\n\n        except Exception as e:\n            print(f\"실패: {original_url} -> {e}\")\n            results.append({'Title': title, 'Link': original_url, 'content': f'Error: {e}'})\n\n    df_result = pd.DataFrame(results)\n    df_result.to_csv(output_file, index=False, encoding='utf-8-sig')\n    print(f\"\\n✅ 네이버 블로그 스크랩 완료! '{output_file}' 확인.\")\n\nif __name__ == \"__main__\":\n    scrape_naver_blog()"]};

const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
let store = {};
try { store = JSON.parse(localStorage.getItem("w2-steps") || "{}"); } catch(e) { store = {}; }
const save = () => { try { localStorage.setItem("w2-steps", JSON.stringify(store)); } catch(e) {} };

function copyBlock([label, text]){
  const isUrl = /^URL$/.test(label);
  return `<div class="copy${isUrl?" url":""}"><div class="copy-top"><span class="tag">복사 · ${esc(label)}</span><button class="copybtn" type="button" data-copy="${esc(text)}">복사</button></div><pre>${esc(text)}</pre></div>`;
}
let total = 0;
function renderBlock(b, mid){
  if (b.h) return `<h3>${esc(b.h)}</h3>`;
  if (b.p) return `<p class="goal">${esc(b.p)}</p>`;
  if (b.note) return `<div class="note ${b.note[0]}">${b.note[1]}</div>`;
  if (b.flow) return `<div class="flow">${b.flow.map((f,i)=>`${i?'<em aria-hidden="true">→</em>':''}<span class="${f[1]?'key':''}">${esc(f[0])}</span>`).join("")}</div>`;
  if (b.concepts) return `<div class="concepts">${b.concepts.map(c=>`<div class="concept"><b>${esc(c[0])}</b><small>${esc(c[1])}</small></div>`).join("")}</div>`;
  if (b.tree) return `<div class="tree"><pre>${b.tree.replace(/&(?!lt;|gt;|amp;)/g,"&amp;")}</pre></div>`;
  if (b.colab) return renderColab();
  if (b.formula) return `<div class="formula"><div class="eq"><span>/스킬명</span><em>+</em><span>파일 첨부 또는 경로</span><em>+</em><span>짧은 지시</span></div><p class="goal" style="margin-top:10px">스킬에 작업 절차가 들어 있어 프롬프트는 짧아도 됩니다. 폴더 지정 → / 로 스킬 호출 → 파일 첨부 → "보고서를 작성해", "ppt를 작성해".</p></div>`;
  if (b.table) return `<div class="tw"><table><thead><tr>${b.table.head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${b.table.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  if (b.links) return `<div class="tw"><table><thead><tr><th>이름</th><th>주소</th><th></th></tr></thead><tbody>${b.links.map(l=>`<tr><td>${esc(l[0])}</td><td style="word-break:break-all"><a href="${esc(l[1])}" target="_blank" rel="noopener">${esc(l[1])}</a></td><td><button class="copybtn" type="button" data-copy="${esc(l[1])}">복사</button></td></tr>`).join("")}</tbody></table></div>`;
  if (b.steps) return `<ol class="steps">${b.steps.map((s,i)=>{
      const key = `${mid}-${b._k}-${i}`; total++;
      const on = !!store[key];
      return `<li class="step${on?" done":""}"><input type="checkbox" id="${key}" data-key="${key}" ${on?"checked":""}><div class="body"><label for="${key}">${esc(s.t)}</label>${s.cp?`<span class="cp">줌 ${esc(s.cp)}번</span>`:""}${s.d?`<p>${esc(s.d)}</p>`:""}${(s.copy||[]).map(copyBlock).join("")}</div></li>`;
    }).join("")}</ol>`;
  return "";
}
// ---------- 코랩 노트북 ----------
const NB_FILES = [
 {f:"1.뉴스주소_크롤러.ipynb", what:"네이버 뉴스 검색 결과에서 제목과 링크를 모읍니다.", io:["(검색 키워드)","url_news{s}.csv"]},
 {f:"2.뉴스본문_스크랩.ipynb", what:"1번에서 만든 링크를 하나씩 열어 기사 본문을 모읍니다. 실행 전에 1번 결과 CSV를 왼쪽 폴더 아이콘으로 업로드하세요.", io:["url_news{s}.csv","content_news{s}.csv"]},
 {f:"3.블로그주소 크롤러.ipynb", what:"보너스. 네이버 블로그 검색 결과에서 글 제목과 링크를 모읍니다.", io:["(검색 키워드)","blogurlout.csv"]},
 {f:"4.블로그본문스크랩1.ipynb", what:"보너스. 3번에서 만든 링크의 블로그 본문을 모읍니다. 실행 전에 blogurlout.csv를 업로드하세요.", io:["blogurlout.csv","blogmain.csv"]}
];
const PREP = `# (선택) 1번 실행 전 준비 셀: 크롬과 크롤링 프로그램 설치
# 강의에서 Gemini가 대신 설치해 준 작업을 한 셀로 모은 것입니다.
!pip -q install undetected-chromedriver selenium
!wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
!apt-get -qq update
!apt-get -qq install -y ./google-chrome-stable_current_amd64.deb`;
const DEF = {nkw:"AI 교육", nn:100, sfx:"", bkw:"ai 에이전트", bn:100};
const getSet = () => {
  const v = id => (document.getElementById(id)?.value ?? "");
  const txt = (x,d) => (x.replace(/["\\\n\r]/g,"").trim() || d);
  const num = (x,d) => { const n = parseInt(x,10); return Number.isFinite(n) ? Math.min(1000, Math.max(1, n)) : d; };
  return {nkw:txt(v("nkw"),DEF.nkw), nn:num(v("nn"),DEF.nn), sfx:v("sfx").replace(/[^0-9A-Za-z_-]/g,""), bkw:txt(v("bkw"),DEF.bkw), bn:num(v("bn"),DEF.bn)};
};
function nbCode(i, s){
  const src = NB_CODE[NB_FILES[i].f] || [];
  if (i===0) return [src[0]
    .replace('scrape_naver_sds_main_only("AI 교육", 100)', `scrape_naver_sds_main_only("${s.nkw}", ${s.nn})`)
    .replace('df.to_csv("url_news.csv"', `df.to_csv("url_news${s.sfx}.csv"`)];
  if (i===1) return [src[0]
    .replace('extract_news_content("url_news.csv", "content_news.csv")', `extract_news_content("url_news${s.sfx}.csv", "content_news${s.sfx}.csv")`)];
  if (i===2) {
    let c = src[0];
    if (s.bkw !== DEF.bkw) c = c.replace("import re\n","import re\nfrom urllib.parse import quote\n")
      .replace(/url = "https:\/\/search\.naver\.com[^"\n]*"/, `url = "https://search.naver.com/search.naver?ssc=tab.blog.all&sm=tab_jum&query=" + quote("${s.bkw}")`);
    if (s.bn !== 100) c = c.split("< 100").join(`< ${s.bn}`).split(">= 100").join(`>= ${s.bn}`);
    const chk = (src[1]||"").split("'out.csv'").join("'blogurlout.csv'").split("out.csv 파일").join("blogurlout.csv 파일");
    return chk ? [c, chk] : [c];
  }
  return [src[0].split("[:100]").join(`[:${s.bn}]`)];
}
function renderColab(){
  const cards = NB_FILES.map((n,i)=>{
    const cells = nbCode(i, DEF);
    const prep = i===0 ? `<div class="copy"><div class="copy-top"><span class="tag">복사 · 준비 셀 (에러가 나면 먼저 실행)</span><button class="copybtn" type="button" data-copy="${esc(PREP)}">복사</button></div><pre>${esc(PREP)}</pre></div>` : "";
    const blocks = cells.map((c,k)=>`<div class="copy"><div class="copy-top"><span class="tag">복사 · 코드${cells.length>1?` 셀 ${k+1}${k===1?" (결과 확인)":""}`:""}</span><button class="copybtn" type="button" id="nbbtn-${i}-${k}" data-copy="${esc(c)}">복사</button></div><pre id="nbpre-${i}-${k}">${esc(c)}</pre></div>`).join("");
    return `<div class="nbcard"><header><h4>${esc(n.f)}</h4>${i>1?'<span class="badge">보너스</span>':""}</header><div class="io" id="nbio-${i}">입력 ${esc(n.io[0].replace("{s}",""))} → 출력 <b>${esc(n.io[1].replace("{s}",""))}</b></div><p>${esc(n.what)}</p>${prep}${blocks}</div>`;
  }).join("");
  return `<div class="nbbox">
   <div class="dlrow"><p>노트북 4개를 zip 하나로 받습니다(실행 결과는 지운 깨끗한 상태). 압축을 풀고 코랩 > 노트 업로드로 올리세요. 받기가 안 되는 화면이면 아래 코드를 복사해 새 노트에 붙여넣으면 됩니다.</p><button class="btn primary" type="button" id="dlzip">노트북 4개 받기 (zip)</button></div>
   <div class="settings"><h4>내 크롤링 설정</h4><p class="hint">입력하면 아래 코드가 바로 바뀝니다. 파일로 올린 노트북에는 반영되지 않으니, 바꾼 값으로 쓰려면 코드를 복사해 새 노트에 붙여넣으세요.</p>
    <div class="fields">
     <label for="nkw">뉴스 키워드<input id="nkw" value="${DEF.nkw}" autocomplete="off"></label>
     <label for="nn">뉴스 개수<input id="nn" type="number" min="1" max="1000" value="${DEF.nn}" inputmode="numeric"></label>
     <label for="sfx">파일 번호 (선택)<input id="sfx" placeholder="예: 2 → url_news2.csv" autocomplete="off"></label>
     <label for="bkw">블로그 키워드<input id="bkw" value="${DEF.bkw}" autocomplete="off"></label>
     <label for="bn">블로그 개수<input id="bn" type="number" min="1" max="1000" value="${DEF.bn}" inputmode="numeric"></label>
    </div></div>
   ${cards}
   <div class="note tip"><b>코드에서 바뀐 곳</b> 설정값이 들어가는 줄 외에는 강사 원본 그대로입니다. 3번 결과 확인 셀의 파일명(out.csv)만 실제 저장 파일인 blogurlout.csv로 고쳤습니다. 준비 셀은 강의에서 Gemini가 해 준 설치 작업을 미리 모은 것입니다.</div>
  </div>`;
}
function refreshCodes(){
  const s = getSet();
  NB_FILES.forEach((n,i)=>{
    nbCode(i,s).forEach((c,k)=>{
      const pre = document.getElementById(`nbpre-${i}-${k}`), btn = document.getElementById(`nbbtn-${i}-${k}`);
      if (pre) { pre.textContent = c; btn.dataset.copy = c; }
    });
    const io = document.getElementById(`nbio-${i}`);
    if (io) io.innerHTML = `입력 ${esc(n.io[0].replace("{s}",s.sfx))} → 출력 <b>${esc(n.io[1].replace("{s}",s.sfx))}</b>`;
  });
}
let DL = null;
try { if (window.claude && typeof window.claude.use === "function") window.claude.use("downloads").then(x=>{ DL = x; }, ()=>{}); } catch(e) {}
async function downloadZip(){
  const bin = atob(NB_ZIP_B64), bytes = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  const blob = new Blob([bytes], {type:"application/zip"}), name = "크롤링_구글코랩.zip";
  if (DL) {
    try { await DL.save({filename:name, data:blob}); say("저장했어요. 압축을 풀어 코랩에 올리세요"); }
    catch(e) { if (e && e.code === "declined") return; say("이 화면에서는 받기가 안 돼요. 아래 코드를 복사해 쓰세요"); }
    return;
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "colab_crawling_notebooks.zip";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  say("받기를 시작했어요. 안 되면 아래 코드를 복사해 쓰세요");
}
document.addEventListener("input", e=>{ if (e.target.closest && e.target.closest(".settings")) refreshCodes(); });

const main = document.getElementById("main"), tabs = document.getElementById("tabs");
main.innerHTML = MODS.map((m,mi)=>{
  let k=0; m.blocks.forEach(b=>{ if(b.steps) b._k = k++; });
  return `<section class="mod" id="${m.id}" role="tabpanel" aria-labelledby="t-${m.id}" ${mi?"hidden":""}>
    <div class="mod-head"><h2>${esc(m.title)}</h2>${m.time?`<span class="time">녹화본 ${esc(m.time)}</span>`:""}</div>
    <p class="goal">${esc(m.goal)}</p>
    ${m.blocks.map(b=>renderBlock(b,m.id)).join("")}
    <div class="nav"><button class="btn" type="button" data-go="${mi-1}" ${mi?"":"disabled"}>← ${mi?esc(MODS[mi-1].short):""}</button><button class="btn primary" type="button" data-go="${mi+1}" ${mi<MODS.length-1?"":"disabled"}>${mi<MODS.length-1?esc(MODS[mi+1].short)+" →":""}</button></div>
  </section>`;
}).join("");
tabs.innerHTML = MODS.map((m,mi)=>`<li><button role="tab" id="t-${m.id}" aria-controls="${m.id}" aria-selected="${mi?"false":"true"}" data-go="${mi}"><span class="n">${mi===0?"00":mi===MODS.length-1?"부록":"0"+mi}</span>${esc(m.short)}</button></li>`).join("");

function show(i, scroll){
  if (i<0 || i>=MODS.length) return;
  MODS.forEach((m,mi)=>{
    document.getElementById(m.id).hidden = mi!==i;
    document.getElementById("t-"+m.id).setAttribute("aria-selected", mi===i?"true":"false");
  });
  const tb = document.getElementById("t-"+MODS[i].id), bar = document.querySelector(".tabs");
  bar.scrollLeft = Math.max(0, tb.offsetLeft - 16);
  try { history.replaceState(null,"","#"+MODS[i].id); } catch(e) {}
  if (scroll && bar.getBoundingClientRect().top <= 1) window.scrollTo({top: document.querySelector("header").offsetHeight});
}
function updateBar(){
  const done = Object.values(store).filter(Boolean).length;
  document.getElementById("barFill").style.width = (total? done/total*100 : 0) + "%";
  document.getElementById("barText").textContent = `${done} / ${total} 단계 완료`;
}
const toast = document.getElementById("toast"); let tt;
function say(msg){ toast.textContent = msg; toast.classList.add("show"); clearTimeout(tt); tt = setTimeout(()=>toast.classList.remove("show"), 1600); }

document.addEventListener("click", e=>{
  if (e.target.closest("#dlzip")) { downloadZip(); return; }
  const go = e.target.closest("[data-go]");
  if (go) { show(+go.dataset.go, true); return; }
  const cb = e.target.closest(".copybtn");
  if (cb) {
    const text = cb.dataset.copy;
    const done = () => { cb.textContent = "복사됨"; cb.classList.add("ok"); say("복사했어요. 붙여넣기(Ctrl+V) 하세요"); setTimeout(()=>{cb.textContent="복사"; cb.classList.remove("ok");},1500); };
    const fallback = () => {
      const pre = cb.closest(".copy")?.querySelector("pre") || cb.closest("tr")?.querySelector("a");
      if (pre) { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
      say("텍스트를 선택해 두었어요. Ctrl+C로 복사하세요");
    };
    try { navigator.clipboard.writeText(text).then(done, fallback); } catch(err) { fallback(); }
  }
});
document.addEventListener("change", e=>{
  const k = e.target.dataset && e.target.dataset.key;
  if (!k) return;
  store[k] = e.target.checked; save();
  e.target.closest(".step").classList.toggle("done", e.target.checked);
  updateBar();
});
const start = MODS.findIndex(m=>"#"+m.id===location.hash);
show(start>=0?start:0, false);
updateBar();
</script>
</body>
